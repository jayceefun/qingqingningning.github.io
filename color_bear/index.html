          <div class="cloud c1"></div>
          <div class="cloud c3"></div>
          <button type="button" class="art balloon-wrap balloon-hero float interact" data-interact="balloon" aria-label="点气球">
            <svg class="art-svg" viewBox="0 0 80 110"><use href="#sym-balloon"/></svg>
            <span class="tap-hint">✨</span>
          </button>
          <div class="hill hill-mid"></div>
          <button type="button" class="art bear-wrap leftish interact" data-interact="bear" aria-label="摸摸小熊">
            <span class="ground-shadow"></span>
            <svg class="art-svg" viewBox="0 -8 100 160"><use href="#sym-bear-look"/></svg>
          </button>
        </div>
        <div class="caption">
          <p>清晨，小熊看见一只白白的气球。<br />它想：要是涂上颜色，一定更漂亮。</p>
        </div>
      </section>

      <!-- 2 颜料罐上色 -->
      <section class="page" data-page="2">
        <div class="sky sky-paint">
          <div class="vignette"></div>
          <button type="button" class="art balloon-wrap float interact" data-interact="balloon" id="paintBalloon" aria-label="点气球">
            <svg class="art-svg" viewBox="0 0 80 110"><use href="#sym-balloon"/></svg>
          </button>
          <div class="hill hill-front"></div>
          <button type="button" class="art bear-wrap leftish small interact" data-interact="bear" aria-label="摸摸小熊">
            <span class="ground-shadow"></span>
            <svg class="art-svg" viewBox="0 -8 120 160"><use href="#sym-bear-paint"/></svg>
          </button>
          <div class="pot-row">
            <button type="button" class="art pot interact" data-interact="pot" data-color="#e23b3b" data-name="红" aria-label="红颜料">
              <svg class="art-svg" viewBox="0 0 60 70"><use href="#sym-pot-red"/></svg>
            </button>
            <button type="button" class="art pot interact" data-interact="pot" data-color="#f0c14a" data-name="黄" aria-label="黄颜料">
              <svg class="art-svg" viewBox="0 0 60 70"><use href="#sym-pot-yellow"/></svg>
            </button>
            <button type="button" class="art pot interact" data-interact="pot" data-color="#5eb7e6" data-name="蓝" aria-label="蓝颜料">
              <svg class="art-svg" viewBox="0 0 60 70"><use href="#sym-pot-blue"/></svg>
            </button>
          </div>
        </div>
        <div class="caption">
          <p>桌上摆着三罐颜料。<br />点颜料罐，气球就会换上颜色。</p>
        </div>
      </section>

      <!-- 3 给太阳涂黄 -->
      <section class="page" data-page="3">
        <div class="sky sky-morn">
          <div class="vignette"></div>
          <div class="cloud c2"></div>
          <button type="button" class="art sun-wrap glow interact" data-interact="sun-paint" id="sunTarget" aria-label="点太阳上色">
            <svg class="art-svg" viewBox="0 0 120 120"><use href="#sym-sun"/></svg>
            <span class="tap-hint">☀</span>
          </button>
          <div class="hill hill-mid"></div>
          <button type="button" class="art bear-wrap leftish interact" data-interact="bear" aria-label="摸摸小熊">
            <span class="ground-shadow"></span>
            <svg class="art-svg" viewBox="0 -8 120 160"><use href="#sym-bear-paint"/></svg>
          </button>
          <div class="pot-row">
            <button type="button" class="art pot interact" data-interact="pot-pick" data-color="#e23b3b" data-name="红" aria-label="红颜料">
              <svg class="art-svg" viewBox="0 0 60 70"><use href="#sym-pot-red"/></svg>
            </button>
            <button type="button" class="art pot interact" data-interact="pot-pick" data-color="#f0c14a" data-name="黄" aria-label="黄颜料">
              <svg class="art-svg" viewBox="0 0 60 70"><use href="#sym-pot-yellow"/></svg>
            </button>
            <button type="button" class="art pot interact" data-interact="pot-pick" data-color="#5eb7e6" data-name="蓝" aria-label="蓝颜料">
              <svg class="art-svg" viewBox="0 0 60 70"><use href="#sym-pot-blue"/></svg>
            </button>
          </div>
        </div>
        <div class="caption">
          <p>太阳想要暖暖的黄色。<br />先点黄颜料罐，再点太阳。</p>
        </div>
      </section>

      <!-- 4 摘苹果 -->
      <section class="page" data-page="4">
        <div class="sky sky-yard">
          <div class="vignette"></div>
          <button type="button" class="art tree-wrap interact" data-interact="tree" aria-label="摇一摇树">
            <svg class="art-svg" viewBox="0 0 120 140"><use href="#sym-tree"/></svg>
          </button>
          <button type="button" class="art apple-wrap a1 interact" data-interact="apple" aria-label="红苹果">
            <svg class="art-svg" viewBox="0 0 60 60"><use href="#sym-apple-red"/></svg>
          </button>
          <button type="button" class="art apple-wrap a2 interact" data-interact="apple" aria-label="红苹果">
            <svg class="art-svg" viewBox="0 0 60 60"><use href="#sym-apple-red"/></svg>
          </button>
          <button type="button" class="art apple-wrap a3 interact" data-interact="apple" aria-label="红苹果">
            <svg class="art-svg" viewBox="0 0 60 60"><use href="#sym-apple-red"/></svg>
          </button>
          <button type="button" class="art basket-wrap interact" data-interact="basket" aria-label="篮子">
            <svg class="art-svg" viewBox="0 0 100 60"><use href="#sym-basket"/></svg>
          </button>
          <button type="button" class="art bear-wrap rightish small interact" data-interact="bear" aria-label="摸摸小熊">
            <span class="ground-shadow"></span>
            <svg class="art-svg" viewBox="0 -8 110 160"><use href="#sym-bear-reach"/></svg>
          </button>
        </div>
        <div class="caption">
          <p>树上结了红红的苹果。<br />点苹果，放进篮子里。</p>
        </div>
      </section>

      <!-- 5 混合变橙 -->
      <section class="page" data-page="5">
        <div class="sky sky-mix">
          <div class="vignette"></div>
          <button type="button" class="art mix-drop d-red interact" data-interact="mix" data-tone="red" aria-label="红颜料滴">
            <svg class="art-svg" viewBox="0 0 60 70"><use href="#sym-drop-red"/></svg>
          </button>
          <button type="button" class="art mix-drop d-yel interact" data-interact="mix" data-tone="yellow" aria-label="黄颜料滴">
            <svg class="art-svg" viewBox="0 0 60 70"><use href="#sym-drop-yellow"/></svg>
          </button>
          <button type="button" class="art palette-wrap interact" data-interact="palette" aria-label="调色盘">
            <svg class="art-svg" viewBox="0 0 120 90"><use href="#sym-palette"/></svg>
          </button>
          <button type="button" class="art flower-bloom interact" data-interact="flower" id="orangeFlower" aria-label="橙色小花">
            <svg class="art-svg" viewBox="0 0 80 80"><use href="#sym-flower-orange"/></svg>
          </button>
          <div class="hill hill-front"></div>
          <button type="button" class="art bear-wrap leftish small interact" data-interact="bear" aria-label="摸摸小熊">
            <span class="ground-shadow"></span>
            <svg class="art-svg" viewBox="0 -8 100 160"><use href="#sym-bear-sit"/></svg>
          </button>
        </div>
        <div class="caption">
          <p>红和黄会变成什么呢？<br />先点两滴颜料，再点调色盘。</p>
        </div>
      </section>

      <!-- 6 蓝天小鸟 -->
      <section class="page" data-page="6">
        <div class="sky sky-blue">
          <div class="vignette"></div>
          <button type="button" class="cloud c1 interact" data-interact="cloud" aria-label="点云朵"></button>
          <button type="button" class="cloud c2 interact" data-interact="cloud" aria-label="点云朵"></button>
          <button type="button" class="cloud c3 interact" data-interact="cloud" aria-label="点云朵"></button>
          <button type="button" class="art bird-wrap interact" data-interact="bird" id="blueBird" aria-label="点小鸟">
            <svg class="art-svg" viewBox="0 0 80 60"><use href="#sym-bird"/></svg>
          </button>
          <div class="hill hill-mid"></div>
          <button type="button" class="art bear-wrap leftish interact" data-interact="bear" aria-label="摸摸小熊">
            <span class="ground-shadow"></span>
            <svg class="art-svg" viewBox="0 -8 100 160"><use href="#sym-bear-look"/></svg>
          </button>
          <div class="pot-row">
            <button type="button" class="art pot interact" data-interact="sky-pot" data-color="#5eb7e6" aria-label="蓝颜料">
              <svg class="art-svg" viewBox="0 0 60 70"><use href="#sym-pot-blue"/></svg>
            </button>
          </div>
        </div>
        <div class="caption">
          <p>点蓝颜料，云朵变成蓝蓝的。<br />小鸟也会飞过来玩。</p>
        </div>
      </section>

      <!-- 7 找红色 -->
      <section class="page" data-page="7">
        <div class="sky sky-hunt">
          <div class="vignette"></div>
          <button type="button" class="art hunt-item h1 interact" data-interact="hunt" data-ok="0" aria-label="绿苹果">
            <svg class="art-svg" viewBox="0 0 60 60"><use href="#sym-apple-green"/></svg>
          </button>
          <button type="button" class="art hunt-item h2 interact" data-interact="hunt" data-ok="1" aria-label="红苹果">
            <svg class="art-svg" viewBox="0 0 60 60"><use href="#sym-apple-red"/></svg>
          </button>
          <button type="button" class="art hunt-item h3 interact" data-interact="hunt" data-ok="0" aria-label="黄苹果">
            <svg class="art-svg" viewBox="0 0 60 60"><use href="#sym-apple-yellow"/></svg>
          </button>
          <button type="button" class="art hunt-item h4 interact" data-interact="hunt" data-ok="0" aria-label="粉花">
            <svg class="art-svg" viewBox="0 0 80 80"><use href="#sym-flower-pink"/></svg>
          </button>
          <button type="button" class="art hunt-item h5 interact" data-interact="hunt" data-ok="0" aria-label="蓝花">
            <svg class="art-svg" viewBox="0 0 80 80"><use href="#sym-flower-blue"/></svg>
          </button>
          <div class="hill hill-front"></div>
          <button type="button" class="art bear-wrap leftish small interact" data-interact="bear" aria-label="摸摸小熊">
            <span class="ground-shadow"></span>
            <svg class="art-svg" viewBox="0 -8 100 160"><use href="#sym-bear-sit"/></svg>
          </button>
        </div>
        <div class="caption">
          <p>找一找：哪一个是红色的？<br />点对了，小熊会开心。</p>
        </div>
      </section>

      <!-- 8 彩色派对 -->
      <section class="page" data-page="8">
        <div class="sky sky-party">
          <div class="vignette"></div>
          <div class="rainbow" aria-hidden="true"></div>
          <div class="sparkles" aria-hidden="true"></div>
          <button type="button" class="art balloon-party b1 float interact" data-interact="party-balloon" data-color="#e23b3b" aria-label="红气球">
            <svg class="art-svg" viewBox="0 0 80 110"><use href="#sym-balloon"/></svg>
          </button>
          <button type="button" class="art balloon-party b2 float interact" data-interact="party-balloon" data-color="#f0c14a" aria-label="黄气球">
            <svg class="art-svg" viewBox="0 0 80 110"><use href="#sym-balloon"/></svg>
          </button>
          <button type="button" class="art balloon-party b3 float interact" data-interact="party-balloon" data-color="#5eb7e6" aria-label="蓝气球">
            <svg class="art-svg" viewBox="0 0 80 110"><use href="#sym-balloon"/></svg>
          </button>
          <div class="hill hill-front"></div>
          <button type="button" class="flowers-deco f-left interact" data-interact="flower" aria-label="点小花"></button>
          <button type="button" class="flowers-deco f-right interact" data-interact="flower" aria-label="点小花"></button>
          <button type="button" class="art bear-wrap interact" data-interact="bear" aria-label="摸摸小熊">
            <span class="ground-shadow"></span>
            <svg class="art-svg" viewBox="0 -8 100 160"><use href="#sym-bear-happy"/></svg>
            <span class="tap-hint">♡</span>
          </button>
        </div>
        <div class="caption caption-center">
          <p>彩色的早晨真开心！<br />点气球、点小熊，再玩一会儿。<br />— 完 —</p>
        </div>
      </section>
    </main>

    <nav class="controls">
      <button class="btn" id="btnPrev" type="button">上一页</button>
      <div class="dots" id="dots"></div>
      <button class="btn btn-primary" id="btnNext" type="button">下一页</button>
    </nav>
    <p class="hint" id="hint">适合 2–4 岁 · 点图画认识红黄蓝</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
